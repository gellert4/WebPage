name: Deploy Szalai Automation to GitHub Pages

on:
  push:
    branches: ["main", "szalai-automation"]
    paths:
      - "szalai-automation-site/**"
      - ".github/workflows/szalai-automation-pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "szalai-automation-site/**"
      - ".github/workflows/szalai-automation-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "szalai-automation-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: szalai-automation

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./szalai-automation-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
