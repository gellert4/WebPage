name: Validate Szalai Automation production site

on:
  push:
    branches: ["szalai-automation"]
    paths:
      - "szalai-automation-site/**"
      - ".github/workflows/szalai-automation-pages.yml"
      - ".formsubmit-activation-trigger"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: szalai-automation

      - name: Verify required production files
        run: |
          set -euo pipefail
          cd szalai-automation-site
          for file in index.html styles.css production.css script.js privacy.html terms.html security.html thanks.html 404.html favicon.svg robots.txt sitemap.xml site.webmanifest .well-known/security.txt; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
          ! grep -R "contact@yourdomain" .

      - name: Validate JavaScript syntax
        run: node --check szalai-automation-site/script.js

      - name: Validate manifest, sitemap and local references
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, xml.etree.ElementTree as ET
          root = Path('szalai-automation-site')
          json.loads((root/'site.webmanifest').read_text())
          ET.parse(root/'sitemap.xml')
          html = (root/'index.html').read_text()
          refs = re.findall(r'(?:href|src)="([^"#]+)"', html)
          for ref in refs:
              if ref.startswith(('http://','https://','mailto:')):
                  continue
              path = root / ref.split('?')[0]
              if not path.exists():
                  raise SystemExit(f'Missing local reference: {ref}')
          print('Static production checks passed')
          PY

      - name: Smoke test over HTTP
        run: |
          cd szalai-automation-site
          python -m http.server 8080 >/tmp/szalai-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8080/ | grep -q "Szalai Automation"
          curl --fail --silent http://127.0.0.1:8080/privacy.html | grep -q "Adatkezelési"
          curl --fail --silent http://127.0.0.1:8080/terms.html | grep -q "Jogi"
          curl --fail --silent http://127.0.0.1:8080/security.html | grep -q "Biztonság"
          curl --fail --silent http://127.0.0.1:8080/thanks.html | grep -q "Köszönöm"

      - name: One-time FormSubmit activation request
        if: contains(github.event.head_commit.message, '[activate-form]')
        run: |
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/json' \
            -X POST 'https://formsubmit.co/ajax/szalai2003@gmail.com' \
            -F 'name=Szalai Automation setup' \
            -F 'email=szalai2003@gmail.com' \
            -F 'service=Setup test' \
            -F 'problem=One-time FormSubmit activation test. This is not a customer lead.' \
            -F 'budget=Setup test' \
            -F '_subject=Szalai Automation form activation test' \
            -F '_captcha=false' \
            -F '_url=https://gellert4.github.io/WebPage/'
