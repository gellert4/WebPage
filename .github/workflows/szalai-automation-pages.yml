name: Validate Szalai Automation production site

on:
  push:
    branches: ["szalai-production"]
    paths:
      - "szalai-automation-site/**"
      - ".github/workflows/szalai-automation-pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "szalai-automation-site/**"
      - ".github/workflows/szalai-automation-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify required production files
        run: |
          set -euo pipefail
          cd szalai-automation-site
          for file in index.html styles.css production.css script.js privacy.html terms.html security.html thanks.html 404.html favicon.svg robots.txt sitemap.xml site.webmanifest vercel.json .nojekyll .well-known/security.txt; do
            test -e "$file" || { echo "Missing: $file"; exit 1; }
          done
          ! grep -R "contact@yourdomain" .
          ! grep -R "TODO\|FIXME" . --exclude=README.md
          grep -q 'action="https://formsubmit.co/szalai2003@gmail.com"' index.html
          grep -q 'form-action https://formsubmit.co' index.html
          grep -q 'https://gellert4.github.io/WebPage/thanks.html' index.html

      - name: Validate JavaScript syntax
        run: node --check szalai-automation-site/script.js

      - name: Validate JSON, XML, HTML and local references
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json, re, xml.etree.ElementTree as ET

          root = Path('szalai-automation-site')
          json.loads((root/'site.webmanifest').read_text(encoding='utf-8'))
          json.loads((root/'vercel.json').read_text(encoding='utf-8'))
          ET.parse(root/'sitemap.xml')

          class Parser(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)

          for html_file in root.glob('*.html'):
              text = html_file.read_text(encoding='utf-8')
              Parser().feed(text)
              refs = re.findall(r'(?:href|src)="([^"#]+)"', text)
              for ref in refs:
                  if ref.startswith(('http://','https://','mailto:','tel:')):
                      continue
                  local = ref.split('?')[0]
                  if local in ('', './'):
                      continue
                  path = root / local
                  if not path.exists():
                      raise SystemExit(f'{html_file}: missing local reference: {ref}')
          print('Static production checks passed')
          PY

      - name: Smoke test over HTTP
        run: |
          cd szalai-automation-site
          python -m http.server 8080 >/tmp/szalai-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8080/ | grep -q "Szalai Automation"
          curl --fail --silent http://127.0.0.1:8080/privacy.html | grep -q "Adatkezelési"
          curl --fail --silent http://127.0.0.1:8080/terms.html | grep -q "Jogi"
          curl --fail --silent http://127.0.0.1:8080/security.html | grep -q "Biztonság"
          curl --fail --silent http://127.0.0.1:8080/thanks.html | grep -q "Köszönöm"
          curl --fail --silent http://127.0.0.1:8080/.well-known/security.txt | grep -q "Contact: mailto:szalai2003@gmail.com"
